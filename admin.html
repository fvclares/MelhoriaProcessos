<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dicionário Operacional — Administração</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="layout admin-layout">
      <section class="panel admin-panel">
        <p class="eyebrow">MVP 3 · Administração</p>
        <h1>Dicionário operacional</h1>
        <p class="intro">Revise conceitos identificados nos relatos, consulte suas evidências e decida seu estado oficial.</p>

        <form id="login-form" class="review-form">
          <label>E-mail<input id="email" type="email" autocomplete="username" required /></label>
          <label>Senha<input id="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
        </form>

        <section id="dictionary" hidden>
          <div class="admin-actions"><button id="refresh" type="button">Atualizar lista</button><button id="logout" type="button" class="secondary">Sair</button></div>
          <p id="admin-status" class="status" aria-live="polite"></p>
          <div class="table-wrap"><table><thead><tr><th>Conceito</th><th>Tipo</th><th>Estado</th><th>Evidências</th><th>Ações</th></tr></thead><tbody id="entity-list"></tbody></table></div>
          <section id="evidence" class="evidence" hidden></section>
        </section>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
