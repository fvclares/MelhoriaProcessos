<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Inteligência Semântica</title><link rel="stylesheet" href="css/app.css" /></head>
<body><main class="layout admin-layout"><section class="panel admin-panel"><p class="eyebrow">MVP 6 · Inteligência semântica</p><h1>Similaridades e anomalias</h1><p class="intro">Compare relatos pelo significado e encontre variações incomuns com base nos registros validados.</p>
<form id="login-form" class="review-form"><label>E-mail<input id="email" type="email" autocomplete="username" required /></label><label>Senha<input id="password" type="password" autocomplete="current-password" required /></label><button type="submit">Entrar</button></form>
<section id="workspace" hidden><div class="admin-actions"><button id="backfill" type="button">Gerar embeddings</button><button id="insights" type="button">Atualizar insights</button><button id="logout" type="button" class="secondary">Sair</button></div><p id="status" class="status" aria-live="polite"></p><form id="search-form" class="semantic-search"><input id="query" placeholder="Buscar relatos por significado" maxlength="2000" required /><button type="submit">Buscar</button></form><section class="analytics-grid"><article class="analytics-card"><h2>Resultados similares</h2><div id="matches"></div></article><article class="analytics-card"><h2>Grupos semanticamente próximos</h2><div id="pairs"></div></article><article class="analytics-card"><h2>Anomalias recentes</h2><div id="anomalies"></div></article></section></section>
</section></main><script src="js/config.js"></script><script type="module" src="js/semantic.js"></script></body></html>
