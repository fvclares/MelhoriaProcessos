<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Evolução do Conhecimento</title><link rel="stylesheet" href="css/app.css" /></head>
  <body><main class="layout admin-layout"><section class="panel admin-panel">
    <p class="eyebrow">MVP 5 · Evolução assistida</p><h1>Sugestões de conhecimento</h1>
    <p class="intro">A IA propõe evoluções a partir dos registros existentes. Nenhuma sugestão altera o dicionário sem aprovação humana.</p>
    <form id="login-form" class="review-form"><label>E-mail<input id="email" type="email" autocomplete="username" required /></label><label>Senha<input id="password" type="password" autocomplete="current-password" required /></label><button type="submit">Entrar</button></form>
    <section id="workspace" hidden><div class="admin-actions"><button id="generate" type="button">Gerar sugestões</button><button id="refresh" type="button">Atualizar lista</button><button id="logout" type="button" class="secondary">Sair</button></div><p id="status" class="status" aria-live="polite"></p><div id="suggestions" class="suggestions"></div></section>
  </section></main><script src="js/config.js"></script><script type="module" src="js/evolution.js"></script></body>
</html>
