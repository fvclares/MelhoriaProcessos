<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Validação técnica da Plataforma de Inteligência Operacional." />
    <title>Inteligência Operacional — MVP 1</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel" aria-labelledby="page-title">
        <p class="eyebrow">MVP 1 · Interpretação</p>
        <h1 id="page-title">Percepção operacional</h1>
        <p class="intro">Envie uma percepção operacional. A IA propõe uma interpretação estruturada, que ainda não será gravada nem homologada.</p>

        <form id="perception-form">
          <label for="perception">Sua percepção</label>
          <textarea id="perception" name="perception" maxlength="2000" required placeholder="Ex.: O GRAN trava quando tento incluir uma garantia."></textarea>
          <div class="form-footer">
            <span id="character-count" aria-live="polite">0 / 2000</span>
            <button id="submit-button" type="submit">Interpretar</button>
          </div>
        </form>

        <section class="response" aria-live="polite" aria-label="Resultado do teste">
          <p id="status" class="status">Aguardando um teste.</p>
          <pre id="result" hidden></pre>
        </section>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
